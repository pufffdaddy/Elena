<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elena">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ring Elena</title>
<style>
  *{box-sizing:border-box;margin:0}
  :root{--text:#fff;--c:#ff7a59}
  html,body{height:100%;background:#120a10;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #bg{position:fixed;inset:0;background:url(bg.jpg) center/cover no-repeat}
  #bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.25),rgba(0,0,0,.62))}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.4vh,26px);
    padding:calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));text-align:center}
  #call{display:none} body.incall #call{display:flex} body.incall #lobby{display:none}

  .avatar{position:relative;width:min(62vw,46vh);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;flex:none;
    border:5px solid #fff;box-shadow:0 18px 50px rgba(0,0,0,.55);background:#fff;overflow:visible;transition:transform .3s}
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  .avatar span{font-size:min(12vw,9vh);font-weight:800;color:#111}
  .avatar::before{content:"";position:absolute;inset:-5px;border-radius:50%;pointer-events:none}
  h1{font-size:clamp(34px,7vw,68px);font-weight:800;letter-spacing:-.02em;text-shadow:0 3px 18px rgba(0,0,0,.7)}
  .sub{font-size:clamp(15px,2.2vw,20px);font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.8)}
  .big{font-size:clamp(19px,3vw,26px);font-weight:750;color:#111;background:#fff;border-radius:999px;padding:17px 44px;
    box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .15s}
  .big:hover,.big:focus-visible{transform:scale(1.04);outline:none}
  #main{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,2vh,22px)}
  #main:hover .avatar{transform:scale(1.03)}
  .role{font-size:clamp(16px,2.4vw,22px);font-weight:650;letter-spacing:.04em;text-shadow:0 2px 10px rgba(0,0,0,.85);margin-top:-6px}
  .ringbtn{width:clamp(72px,10vw,92px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#fff;color:#111;
    box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .15s;margin-top:6px}
  .ringbtn svg{width:44%;height:44%;transition:transform .25s}
  #main:hover .ringbtn,.ringbtn:hover,.ringbtn:focus-visible{transform:scale(1.08);outline:none}
  #call.live #btn svg{transform:rotate(135deg)}

  #others{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,1.8vw,22px);margin-top:clamp(6px,2vh,22px);max-width:900px}
  .mini{display:flex;flex-direction:column;align-items:center;gap:7px;width:clamp(86px,13vw,128px);min-width:0}
  .mini i{width:clamp(56px,8vw,78px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;
    font-size:clamp(16px,2.2vw,22px);color:#111;background:#fff;border:3px solid #111;box-shadow:0 8px 22px rgba(0,0,0,.5);transition:transform .15s}
  .mini:hover i,.mini:focus-visible i{transform:scale(1.1)} .mini:focus-visible{outline:none}
  .mini b{font-size:clamp(11px,1.3vw,14px);font-weight:650;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.9)}

  #back{position:fixed;z-index:3;top:calc(16px + env(safe-area-inset-top));left:16px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:11px 18px;font-weight:650;font-size:15px}
  #call{cursor:pointer}
  #call.listening .avatar::before{box-shadow:0 0 0 3px #111,0 0 0 9px #fff}
  #call.speaking .avatar::before{box-shadow:0 0 0 3px #111,0 0 0 9px #fff;animation:pulse 1.2s ease-in-out infinite}
  #call.connecting .avatar::before{box-shadow:0 0 0 7px rgba(255,255,255,.55);animation:pulse 1s ease-in-out infinite}
  #call.speaking .avatar{transform:scale(1.05)}
  @keyframes pulse{50%{box-shadow:0 0 0 3px #111,0 0 0 24px rgba(255,255,255,.35)}}
  #status{min-height:1.4em}
  #call.live #btn{background:#111;color:#fff;border:3px solid #fff}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"></div>

<main id="lobby" class="screen">
  <button id="main" type="button">
    <span class="avatar"><img src="avatar.jpg?v=2" alt="Elena"></span>
    <h1>Elena</h1>
    <span class="role">Personlig Assistent</span>
    <span class="ringbtn" aria-label="Ring Elena"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.6 21 3 13.4 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span>
  </button>
</main>

<section id="call" class="screen idle" aria-live="polite">
  <span class="avatar" id="av"></span>
  <h1 id="who"></h1>
  <span class="role" id="role"></span>
  <div class="sub" id="status">Trykk for å ringe</div>
  <button id="btn" class="ringbtn" type="button" aria-label="Ring"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.6 21 3 13.4 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></button>
</section>

<script type="module">
import { Conversation } from "https://cdn.jsdelivr.net/npm/@elevenlabs/client/+esm";

const PEOPLE = [
  { id: "elena",     name: "Elena",                 role: "Personlig assistent",                     line: "Alt som er viktig går via meg.", agent: "agent_6501m86m210nf5z8vr93b9zz2frz", photo: "elena.jpg", color: "#ff7a59", main: true },
  { id: "creative",  name: "Creative Director",     role: "Persona, konsepter og kampanjer",         mono: "CD", agent: "agent_5601m86pckz8e0q8efd8pq941km7", color: "#c77dff" },
  { id: "ops",       name: "Head of Revenue & Ops", role: "Tall, drift og onboarding",               mono: "RO", agent: "agent_6101m86pcr6qfa59mktbha79qk8r", color: "#4cc9f0" },
  { id: "chatting",  name: "Chatting Manager",      role: "Chattere, skift, scripts og salg",        mono: "CM", agent: "agent_2901m86pcx3cfzjtsq6af9k78x76", color: "#57d68d" },
  { id: "social",    name: "Social Media Manager",  role: "Innhold, planer, trender og Shanu",       mono: "SM", agent: "agent_0101m86pd23me9qaetm4v828r7fp", color: "#ffd166" },
  { id: "recruiter", name: "Produksjonssjef",       role: "Rekruttering og team",                    mono: "PS", agent: "agent_2301m86pd7edehr9dbc8hm2g5ng3", color: "#ff5d8f" }
];

const $ = (s) => document.querySelector(s);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

/* lobby */
const elena = PEOPLE[0];
$("#main").addEventListener("click", () => open(elena, true));

/* call */
const call = $("#call"), status = $("#status"), btn = $("#btn");
let person = null, convo = null, busy = false, wake = null;
const set = (state, text, live) => { call.className = state + (live ? " live" : ""); status.textContent = text; btn.setAttribute("aria-label", live ? "Legg på" : "Ring " + person.name); };

function open(p, autostart) {
  person = p;
  document.body.classList.add("incall");
  call.style.setProperty("--c", p.color);
  $("#who").textContent = p.name; $("#role").textContent = p.role === "Personlig assistent" ? "Personlig Assistent" : p.role;
  const av = $("#av"); av.replaceChildren();
  if (p.photo) { const i = el("img"); i.src = "avatar.jpg?v=2"; i.alt = ""; av.append(i); } else av.append(el("span", null, p.mono));
  set("idle", "Trykk for å ringe", false);
  try { history.replaceState(null, "", "#" + p.id); } catch (e) {}
  if (autostart) start();
}
async function start() {
  if (busy || convo) return; busy = true;
  set("connecting", "Ringer …", true);
  try {
    await navigator.mediaDevices.getUserMedia({ audio: true });
    try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {}
    const mine = person;
    convo = await Conversation.startSession({
      agentId: mine.agent, connectionType: "webrtc",
      onConnect: () => set("listening", mine.name + " lytter", true),
      onDisconnect: () => { convo = null; try { wake?.release(); } catch (e) {} home(); },
      onModeChange: (m) => { if (convo && person === mine) set(m.mode === "speaking" ? "speaking" : "listening", mine.name + (m.mode === "speaking" ? " snakker" : " lytter"), true); },
      onError: (e) => { console.log("[Rockstar]", e); status.textContent = "Noe gikk galt. Trykk for å prøve igjen."; }
    });
  } catch (e) {
    console.log("[Rockstar]", e); convo = null;
    set("idle", e && e.name === "NotAllowedError" ? "Gi tilgang til mikrofonen, og trykk igjen" : "Fikk ikke kontakt. Trykk for å prøve igjen.", false);
  }
  busy = false;
}
function home() { document.body.classList.remove("incall"); person = null; try { history.replaceState(null, "", location.pathname); } catch (e) {} }
async function stop() { if (!convo) { home(); return; } const c = convo; convo = null; try { await c.endSession(); } catch (e) {} home(); }

call.addEventListener("click", () => (convo ? stop() : start()));
</script>
</body>
</html>
